<header class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-4">
    <div class="flex items-center justify-between">
      
      <h1 class="text-slate-800 flex items-center gap-2 cursor-pointer" routerLink="/">
        <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-2 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="iconPaths.clients"></svg>
        </div>
        <span class="font-bold text-xl tracking-tight">Gym Manager</span>
      </h1>

      <button (click)="toggleMenu()" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
             [innerHTML]="isMobileMenuOpen() ? iconPaths.close : iconPaths.menu">
        </svg>
      </button>

      <nav class="hidden lg:flex gap-2">
        @for (tab of tabs; track tab.id) {
          <button 
            (click)="selectTab(tab.id)"
            [class.text-blue-600]="activeTab() === tab.id"
            [class.bg-blue-50]="activeTab() === tab.id"
            class="px-4 py-2 rounded-lg flex items-center gap-2 transition-all text-slate-600 hover:bg-slate-50 font-medium border border-transparent cursor-pointer"
            [class.border-blue-100]="activeTab() === tab.id">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="tab.icon"></svg>
            {{ tab.label }}
          </button>
        }
      </nav>
    </div>

    @if (isMobileMenuOpen()) {
      <nav class="lg:hidden mt-4 space-y-2 border-t pt-4 animate-in fade-in slide-in-from-top-2">
        @for (tab of tabs; track tab.id) {
          <button 
            (click)="selectTab(tab.id)"
            [class.bg-blue-50]="activeTab() === tab.id"
            [class.text-blue-600]="activeTab() === tab.id"
            class="w-full px-4 py-3 rounded-lg flex items-center gap-3 text-slate-600 font-medium transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="tab.icon"></svg>
            {{ tab.label }}
          </button>
        }
      </nav>
    }
  </div>
</header>
